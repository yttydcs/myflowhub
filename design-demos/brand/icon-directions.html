<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MyFlowHub Icon Directions</title>
  <!-- 三个方向分别放大 MyFlowHub 的独特模型：权威树、节点容纳资源、订阅持续流。全部使用同一矿物蓝、透明背景和无文字几何，以便只比较概念而不是装饰。 -->
  <style>
    :root{font-family:"Segoe UI Variable Text","Segoe UI","Microsoft YaHei UI",sans-serif;color:#202222;background:#f5f5f4}*{box-sizing:border-box}body{margin:0}header{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;border-bottom:1px solid #dddfde;background:#fff}header strong{font-size:16px}header span{color:#696d6b;font-size:13px}main{min-height:calc(100vh - 64px);display:grid;grid-template-columns:repeat(3,1fr);background:#dddfde;gap:1px}.direction{min-width:0;display:grid;grid-template-rows:280px auto 1fr;background:#fff}.stage{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid #dddfde}.stage div{display:grid;place-items:center}.stage .dark{background:#191a1a}.stage img{width:150px;height:150px}.copy{padding:22px 24px;border-bottom:1px solid #e9eae9}.copy h2{margin:0 0 10px;font-size:18px}.copy p{min-height:48px;margin:0;color:#696d6b;font-size:13px;line-height:1.7}.recommended{display:inline-flex;margin-left:8px;padding:2px 6px;border:1px solid #c9dce7;border-radius:4px;color:#3f6f8f;font-size:11px;vertical-align:2px}.sizes{display:flex;align-items:end;gap:20px;padding:26px 24px}.sample{display:grid;gap:8px;justify-items:center;color:#8c918f;font-size:11px}.sample img{display:block}.sample:nth-child(1) img{width:16px;height:16px}.sample:nth-child(2) img{width:24px;height:24px}.sample:nth-child(3) img{width:32px;height:32px}.sample:nth-child(4) img{width:64px;height:64px}@media(max-width:980px){main{grid-template-columns:1fr}.direction{grid-template-rows:240px auto auto}.stage img{width:128px;height:128px}}
  </style>
</head>
<body>
  <header><strong>MyFlowHub 图标方向</strong><span>矿物蓝 · 透明背景 · 小尺寸优先</span></header>
  <main>
    <section class="direction"><div class="stage"><div><img src="direction-a-authority-tree.svg" alt="权威树图标"></div><div class="dark"><img src="direction-a-authority-tree.svg" alt="权威树图标深色预览"></div></div><div class="copy"><h2>权威树<span class="recommended">推荐</span></h2><p>父节点建立权威，子节点继承信任；每个节点内部的圆点代表其拥有的资源。</p></div><div class="sizes"><span class="sample"><img src="direction-a-authority-tree.svg" alt=""><span>16</span></span><span class="sample"><img src="direction-a-authority-tree.svg" alt=""><span>24</span></span><span class="sample"><img src="direction-a-authority-tree.svg" alt=""><span>32</span></span><span class="sample"><img src="direction-a-authority-tree.svg" alt=""><span>64</span></span></div></section>
    <section class="direction"><div class="stage"><div><img src="direction-b-resource-node.svg" alt="资源节点图标"></div><div class="dark"><img src="direction-b-resource-node.svg" alt="资源节点图标深色预览"></div></div><div class="copy"><h2>资源节点</h2><p>外层是 Node，内部三种端口对应变量、主题与流；强调“一切资源归属于节点”。</p></div><div class="sizes"><span class="sample"><img src="direction-b-resource-node.svg" alt=""><span>16</span></span><span class="sample"><img src="direction-b-resource-node.svg" alt=""><span>24</span></span><span class="sample"><img src="direction-b-resource-node.svg" alt=""><span>32</span></span><span class="sample"><img src="direction-b-resource-node.svg" alt=""><span>64</span></span></div></section>
    <section class="direction"><div class="stage"><div><img src="direction-c-subscription-loop.svg" alt="订阅流图标"></div><div class="dark"><img src="direction-c-subscription-loop.svg" alt="订阅流图标深色预览"></div></div><div class="copy"><h2>订阅流</h2><p>持续环流围绕中心 Hub，三个端口代表不同链路；突出订阅优先和协议可扩展。</p></div><div class="sizes"><span class="sample"><img src="direction-c-subscription-loop.svg" alt=""><span>16</span></span><span class="sample"><img src="direction-c-subscription-loop.svg" alt=""><span>24</span></span><span class="sample"><img src="direction-c-subscription-loop.svg" alt=""><span>32</span></span><span class="sample"><img src="direction-c-subscription-loop.svg" alt=""><span>64</span></span></div></section>
  </main>
</body>
</html>
