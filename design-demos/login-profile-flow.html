<!--
  MyFlowHub 登录 / 首次连接交互原型

  Assumptions
  - 绝大多数启动发生在已有 Profile 上，因此默认展示“使用现有 Profile”。
  - Node ID 由 Authority 在准入成功后分配，常规路径绝不让客户端填写。
  - 父节点公钥与 Authority 公钥只属于高级信任锚点；常规首次连接通过明确的 TOFU 确认完成固定。
  - 已保存但尚未获批的 Profile 是“登录态的一种状态”，不应重新显示完整首次连接表单。

  Reasoning
  - 用两个互斥入口替代 01 / 02 / 03 步骤轴，先回答“我是否已有身份”。
  - Profile 行本身承载状态与父节点地址，减少重复的详情卡和说明文字。
  - 审批与 Permit 是首次连接中的二选一，不再拆成独立大章节。
  - 设备公钥只在 Permit 路径按需出现；审批路径不要求用户先理解或管理它。

  Placeholders
  - Profile、Node ID、端点和公钥均为演示数据，不代表真实网络状态。
  - 按钮只切换原型状态，不会连接父节点、签发 Permit 或写入本地配置。
-->
<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MyFlowHub · 登录与首次连接原型</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      --accent: #3f6f8f;
      --accent-strong: #315c79;
      --accent-soft: #e8f0f5;
      --accent-line: #b8ccd9;
      --danger: #b54b4b;
      --success: #4d8065;
      --warning: #a16c2d;
      --text: #222a30;
      --text-muted: #68727a;
      --text-faint: #8c959c;
      --canvas: #f5f6f7;
      --surface: #ffffff;
      --surface-subtle: #f8f9fa;
      --surface-hover: #f0f3f5;
      --border: #d9dee2;
      --border-strong: #c5ccd1;
      --focus: #5487a9;
      --shadow: 0 12px 34px rgba(31, 43, 51, 0.08);
    }

    * { box-sizing: border-box; }
    html, body { min-width: 760px; min-height: 100%; margin: 0; }
    body { background: var(--canvas); color: var(--text); }
    button, input, textarea, summary { font: inherit; }
    button, summary { cursor: pointer; }
    button:focus-visible, input:focus-visible, textarea:focus-visible, summary:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }

    .app-shell { min-height: 100vh; }
    .topbar {
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    .brand { display: flex; align-items: center; gap: 9px; font-size: 12px; }
    .brand-mark {
      width: 26px;
      height: 26px;
      display: grid;
      place-items: center;
      border-radius: 4px;
      background: var(--accent);
      color: #fff;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: -0.03em;
    }
    .top-action {
      height: 28px;
      padding: 0 9px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--surface);
      color: var(--text-muted);
      font-size: 10px;
    }
    .top-action:hover { background: var(--surface-hover); color: var(--text); }

    .stage {
      width: min(760px, calc(100% - 40px));
      margin: 48px auto 64px;
    }
    .panel {
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }
    .panel-header { padding: 26px 30px 0; }
    .panel-title { margin: 0 0 22px; font-size: 20px; line-height: 1.25; letter-spacing: -0.02em; }
    .view-tabs {
      display: flex;
      gap: 24px;
      border-bottom: 1px solid var(--border);
    }
    .view-tab {
      position: relative;
      height: 38px;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 650;
    }
    .view-tab::after {
      content: "";
      position: absolute;
      right: 0;
      bottom: -1px;
      left: 0;
      height: 2px;
      background: transparent;
    }
    .view-tab[aria-selected="true"] { color: var(--accent-strong); }
    .view-tab[aria-selected="true"]::after { background: var(--accent); }
    .panel-body { padding: 24px 30px 26px; }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 9px;
    }
    .section-head h2 { margin: 0; font-size: 11px; font-weight: 700; }
    .link-button {
      padding: 2px 0;
      border: 0;
      background: transparent;
      color: var(--accent-strong);
      font-size: 10px;
      font-weight: 620;
    }
    .link-button:hover { text-decoration: underline; }

    .profile-list { border: 1px solid var(--border); border-radius: 4px; }
    .profile-row {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto 30px;
      align-items: center;
      min-height: 66px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    .profile-row:last-child { border-bottom: 0; }
    .profile-row.is-selected { background: var(--accent-soft); box-shadow: inset 2px 0 var(--accent); }
    .profile-select {
      min-width: 0;
      height: 100%;
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 10px 14px;
      border: 0;
      background: transparent;
      text-align: left;
    }
    .profile-avatar {
      width: 31px;
      height: 31px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      border: 1px solid var(--accent-line);
      border-radius: 4px;
      background: var(--surface);
      color: var(--accent-strong);
      font-size: 11px;
      font-weight: 750;
    }
    .profile-copy { min-width: 0; display: grid; gap: 4px; }
    .profile-copy strong { overflow: hidden; font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
    .profile-copy small { overflow: hidden; color: var(--text-muted); font-size: 9px; text-overflow: ellipsis; white-space: nowrap; }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--text-muted);
      font-size: 9px;
      white-space: nowrap;
    }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-faint); }
    .status.is-registered .status-dot { background: var(--success); }
    .status.is-pending .status-dot { background: var(--warning); }
    .row-menu {
      width: 26px;
      height: 26px;
      padding: 0;
      border: 0;
      border-radius: 3px;
      background: transparent;
      color: var(--text-faint);
      font-size: 16px;
      letter-spacing: 1px;
    }
    .row-menu:hover { background: rgba(255, 255, 255, 0.75); color: var(--text); }
    .menu-popover {
      position: absolute;
      z-index: 5;
      right: 9px;
      top: 47px;
      width: 112px;
      display: none;
      padding: 4px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--surface);
      box-shadow: 0 8px 24px rgba(31, 43, 51, 0.14);
    }
    .menu-popover.is-open { display: grid; }
    .menu-popover button { padding: 7px 8px; border: 0; border-radius: 3px; background: transparent; color: var(--text); font-size: 9px; text-align: left; }
    .menu-popover button:hover { background: var(--surface-hover); }
    .menu-popover .danger { color: var(--danger); }

    .selected-context {
      min-height: 43px;
      display: flex;
      align-items: center;
      margin-top: 12px;
      padding: 0 12px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--surface-subtle);
      color: var(--text-muted);
      font-size: 9.5px;
      line-height: 1.5;
    }
    .selected-context strong { color: var(--text); }

    .action-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-top: 22px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
    }
    .check-row { display: inline-flex; align-items: center; gap: 7px; color: var(--text-muted); font-size: 9.5px; }
    .check-row input { width: 14px; height: 14px; margin: 0; accent-color: var(--accent); }
    .primary-button, .secondary-button {
      min-height: 34px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0 15px;
      border: 1px solid var(--border-strong);
      border-radius: 4px;
      font-size: 10px;
      font-weight: 680;
    }
    .primary-button { min-width: 178px; border-color: var(--accent); background: var(--accent); color: #fff; }
    .primary-button:hover { border-color: var(--accent-strong); background: var(--accent-strong); }
    .secondary-button { background: var(--surface); color: var(--text); }
    .secondary-button:hover { background: var(--surface-hover); }
    .button-arrow { font-size: 14px; font-weight: 400; }

    .form { display: grid; gap: 18px; }
    .field-grid { display: grid; grid-template-columns: minmax(0, 0.82fr) minmax(0, 1.18fr); gap: 12px; }
    label.field { min-width: 0; display: grid; gap: 6px; color: var(--text); font-size: 10px; font-weight: 650; }
    .input, .textarea {
      width: 100%;
      border: 1px solid var(--border-strong);
      border-radius: 4px;
      background: var(--surface);
      color: var(--text);
      font-size: 10px;
      font-weight: 400;
    }
    .input { height: 34px; padding: 0 9px; }
    .textarea { min-height: 78px; padding: 8px 9px; resize: vertical; line-height: 1.45; }
    .input::placeholder, .textarea::placeholder { color: var(--text-faint); }
    .input-meta { color: var(--text-faint); font-size: 8.5px; font-weight: 400; }
    .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }

    .method-block { display: grid; gap: 11px; }
    .method-label { font-size: 10px; font-weight: 650; }
    .method-switch {
      display: grid;
      grid-template-columns: 1fr 1fr;
      padding: 3px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--surface-subtle);
    }
    .method-option {
      height: 34px;
      border: 0;
      border-radius: 3px;
      background: transparent;
      color: var(--text-muted);
      font-size: 10px;
      font-weight: 620;
    }
    .method-option[aria-pressed="true"] {
      background: var(--surface);
      box-shadow: 0 1px 3px rgba(31, 43, 51, 0.12);
      color: var(--accent-strong);
    }
    .method-content { display: grid; gap: 11px; }
    .method-note {
      margin: 0;
      color: var(--text-muted);
      font-size: 9.5px;
      line-height: 1.55;
    }
    .trust-box {
      min-height: 43px;
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 10px 11px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--surface-subtle);
      color: var(--text-muted);
      font-size: 9px;
      font-weight: 400;
      line-height: 1.5;
    }
    .trust-box input { width: 14px; height: 14px; flex: 0 0 auto; margin: 1px 0 0; accent-color: var(--accent); }
    .key-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 7px; }
    .key-row .input { min-width: 0; }
    .key-row .secondary-button { min-height: 34px; }
    .copy-feedback { min-height: 13px; color: var(--success); font-size: 8.5px; font-weight: 400; }

    .advanced { border-top: 1px solid var(--border); }
    .advanced summary {
      padding: 12px 0 0;
      color: var(--text-muted);
      font-size: 9.5px;
      font-weight: 620;
      list-style: none;
    }
    .advanced summary::-webkit-details-marker { display: none; }
    .advanced summary::after { content: "＋"; float: right; color: var(--text-faint); font-weight: 400; }
    .advanced[open] summary::after { content: "－"; }
    .advanced-body {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 11px;
      padding: 14px 0 2px;
    }
    .advanced-body .full { grid-column: 1 / -1; }

    .toast {
      position: fixed;
      right: 20px;
      bottom: 20px;
      max-width: 340px;
      padding: 10px 12px;
      border: 1px solid var(--border-strong);
      border-radius: 4px;
      background: var(--surface);
      box-shadow: 0 10px 30px rgba(31, 43, 51, 0.14);
      color: var(--text);
      font-size: 9.5px;
      opacity: 0;
      transform: translateY(8px);
      pointer-events: none;
      transition: opacity 120ms ease, transform 120ms ease;
    }
    .toast.is-visible { opacity: 1; transform: translateY(0); }

    @media (max-width: 860px) {
      .stage { margin-top: 28px; }
      .panel-header, .panel-body { padding-right: 22px; padding-left: 22px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand"><span class="brand-mark" aria-hidden="true">M</span><strong>MyFlowHub</strong></div>
      <button class="top-action" type="button" id="appearance-button">浅色</button>
    </header>

    <main class="stage">
      <section class="panel" aria-labelledby="panel-title">
        <header class="panel-header">
          <h1 class="panel-title" id="panel-title">登录 MyFlowHub</h1>
          <div class="view-tabs" role="tablist" aria-label="登录方式">
            <button class="view-tab" type="button" id="existing-tab" role="tab" data-view="existing">使用现有 Profile</button>
            <button class="view-tab" type="button" id="first-tab" role="tab" data-view="first">首次连接</button>
          </div>
        </header>
        <div class="panel-body" id="panel-body"></div>
      </section>
    </main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    const profiles = [
      {
        id: 'personal',
        name: '个人工作区',
        initials: '个',
        endpoint: '192.168.10.12:7331',
        nodeId: '28',
        authorityId: '1',
        status: 'registered'
      },
      {
        id: 'lab',
        name: '实验室节点',
        initials: '实',
        endpoint: 'lab-gateway.local:7331',
        requestId: 'req_7d21…b904',
        status: 'pending'
      }
    ];

    const params = new URLSearchParams(window.location.search);
    const state = {
      view: params.get('view') === 'first' ? 'first' : 'existing',
      profileId: params.get('profile') === 'pending' ? 'lab' : 'personal',
      method: params.get('method') === 'permit' ? 'permit' : 'approval',
      trustConfirmed: true,
      profileName: '新设备',
      endpoint: '192.168.10.12:7331',
      permit: '',
      publicKey: '',
      menuProfileId: ''
    };

    const body = document.getElementById('panel-body');
    const tabs = [...document.querySelectorAll('.view-tab')];
    const toast = document.getElementById('toast');
    let toastTimer;

    function escapeHTML(value) {
      return String(value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function showToast(message) {
      window.clearTimeout(toastTimer);
      toast.textContent = message;
      toast.classList.add('is-visible');
      toastTimer = window.setTimeout(() => toast.classList.remove('is-visible'), 2200);
    }

    function setView(view) {
      state.view = view;
      state.menuProfileId = '';
      render();
    }

    function renderTabs() {
      tabs.forEach((tab) => {
        const selected = tab.dataset.view === state.view;
        tab.setAttribute('aria-selected', String(selected));
        tab.setAttribute('tabindex', selected ? '0' : '-1');
      });
    }

    function profileStatus(profile) {
      if (profile.status === 'registered') {
        return '<span class="status is-registered"><span class="status-dot"></span>已注册</span>';
      }
      return '<span class="status is-pending"><span class="status-dot"></span>等待审批</span>';
    }

    function profileContext(profile) {
      if (profile.status === 'registered') {
        return `设备已注册为 <strong>Node ${profile.nodeId}</strong>，由 Authority Node ${profile.authorityId} 管理。本次只建立到父节点的连接。`;
      }
      return `审批请求 <strong>${profile.requestId}</strong> 已提交。批准后继续使用这个 Profile，不会创建新的 Node ID。`;
    }

    function existingView() {
      const selected = profiles.find((profile) => profile.id === state.profileId) || profiles[0];
      return `
        <div class="section-head">
          <h2>选择 Profile</h2>
          <button class="link-button" type="button" data-action="new-profile">新建 Profile</button>
        </div>
        <div class="profile-list" role="listbox" aria-label="已保存的 Profile">
          ${profiles.map((profile) => `
            <div class="profile-row ${profile.id === state.profileId ? 'is-selected' : ''}" role="option" aria-selected="${profile.id === state.profileId}">
              <button class="profile-select" type="button" data-profile="${profile.id}">
                <span class="profile-avatar" aria-hidden="true">${profile.initials}</span>
                <span class="profile-copy">
                  <strong>${profile.name}</strong>
                  <small>${profile.status === 'registered' ? `Node ${profile.nodeId} · ` : ''}${profile.endpoint}</small>
                </span>
              </button>
              ${profileStatus(profile)}
              <button class="row-menu" type="button" data-menu="${profile.id}" aria-label="管理 ${profile.name}" aria-expanded="${state.menuProfileId === profile.id}">···</button>
              <div class="menu-popover ${state.menuProfileId === profile.id ? 'is-open' : ''}">
                <button type="button" data-action="edit-profile">编辑 Profile</button>
                <button class="danger" type="button" data-action="delete-profile">删除</button>
              </div>
            </div>
          `).join('')}
        </div>
        <div class="selected-context">${profileContext(selected)}</div>
        <div class="action-bar">
          <label class="check-row"><input type="checkbox" checked> 应用启动后自动连接</label>
          <button class="primary-button" type="button" data-action="connect">
            ${selected.status === 'registered' ? '连接父节点' : '检查审批并连接'}
            <span class="button-arrow" aria-hidden="true">→</span>
          </button>
        </div>
      `;
    }

    function approvalFields() {
      return `
        <div class="method-content">
          <p class="method-note">提交后由管理员审批；获批后继续使用这个 Profile，Node ID 会在注册成功时下发。</p>
          <label class="trust-box">
            <input id="trust-confirmation" type="checkbox" ${state.trustConfirmed ? 'checked' : ''}>
            <span>我确认首次连接时信任该端点返回的父节点与 Authority 公钥；注册成功后固定校验。</span>
          </label>
        </div>
      `;
    }

    function permitFields() {
      return `
        <div class="method-content">
          <label class="field">
            本机公钥
            <span class="key-row">
              <input class="input mono" id="public-key" readonly value="${escapeHTML(state.publicKey)}" placeholder="点击右侧生成">
              <button class="secondary-button" type="button" data-action="prepare-key">${state.publicKey ? '复制公钥' : '生成并复制'}</button>
            </span>
            <span class="copy-feedback" id="copy-feedback">${state.publicKey ? '公钥已生成，仅私钥保存在本机。' : ''}</span>
          </label>
          <label class="field">
            Enrollment Permit
            <textarea class="textarea mono" id="permit" spellcheck="false" placeholder='粘贴管理员签发的一次性 Permit'>${escapeHTML(state.permit)}</textarea>
          </label>
        </div>
      `;
    }

    function firstView() {
      const generatedId = state.profileName.trim()
        ? state.profileName.trim().toLowerCase().replace(/[^a-z0-9\u4e00-\u9fff]+/g, '-').replace(/^-|-$/g, '') || 'new-device'
        : 'new-device';
      return `
        <form class="form" id="first-form">
          <div class="field-grid">
            <label class="field">
              Profile 名称
              <input class="input" id="profile-name" required value="${escapeHTML(state.profileName)}" placeholder="例如：个人工作区">
              <span class="input-meta">Profile ID：${escapeHTML(generatedId)}</span>
            </label>
            <label class="field">
              父节点地址
              <input class="input mono" id="endpoint" required value="${escapeHTML(state.endpoint)}" placeholder="例如：192.168.10.12:7331">
              <span class="input-meta">Node ID 将在准入成功后由 Authority 下发</span>
            </label>
          </div>

          <div class="method-block">
            <span class="method-label">准入方式</span>
            <div class="method-switch" role="group" aria-label="准入方式">
              <button class="method-option" type="button" data-method="approval" aria-pressed="${state.method === 'approval'}">申请管理员审批</button>
              <button class="method-option" type="button" data-method="permit" aria-pressed="${state.method === 'permit'}">使用 Permit</button>
            </div>
            ${state.method === 'approval' ? approvalFields() : permitFields()}
          </div>

          <details class="advanced">
            <summary>高级连接设置</summary>
            <div class="advanced-body">
              <label class="field">
                预期父 Node ID
                <input class="input mono" inputmode="numeric" placeholder="首次连接时获取">
              </label>
              <label class="field">
                父节点公钥
                <input class="input mono" spellcheck="false" placeholder="Raw Base64 Ed25519">
              </label>
              <label class="field full">
                Authority 公钥
                <input class="input mono" spellcheck="false" placeholder="Raw Base64 Ed25519">
              </label>
              <label class="check-row full"><input type="checkbox"> 使用 Legacy 兼容连接</label>
            </div>
          </details>

          <div class="action-bar">
            <label class="check-row"><input type="checkbox" checked> 注册后自动连接</label>
            <button class="primary-button" type="submit">
              ${state.method === 'approval' ? '提交申请' : '注册并连接'}
              <span class="button-arrow" aria-hidden="true">→</span>
            </button>
          </div>
        </form>
      `;
    }

    function bindEvents() {
      body.querySelectorAll('[data-profile]').forEach((button) => {
        button.addEventListener('click', () => {
          state.profileId = button.dataset.profile;
          state.menuProfileId = '';
          render();
        });
      });

      body.querySelectorAll('[data-menu]').forEach((button) => {
        button.addEventListener('click', () => {
          state.menuProfileId = state.menuProfileId === button.dataset.menu ? '' : button.dataset.menu;
          render();
        });
      });

      body.querySelectorAll('[data-method]').forEach((button) => {
        button.addEventListener('click', () => {
          state.method = button.dataset.method;
          render();
        });
      });

      const newProfile = body.querySelector('[data-action="new-profile"]');
      if (newProfile) newProfile.addEventListener('click', () => setView('first'));

      const connect = body.querySelector('[data-action="connect"]');
      if (connect) connect.addEventListener('click', () => {
        const selected = profiles.find((profile) => profile.id === state.profileId);
        showToast(selected.status === 'registered' ? `正在连接「${selected.name}」` : '正在检查审批状态');
      });

      body.querySelectorAll('[data-action="edit-profile"]').forEach((button) => button.addEventListener('click', () => showToast('编辑入口会在生产实现中打开 Profile 设置')));
      body.querySelectorAll('[data-action="delete-profile"]').forEach((button) => button.addEventListener('click', () => showToast('原型不会删除本地 Profile')));

      const profileName = body.querySelector('#profile-name');
      if (profileName) profileName.addEventListener('input', (event) => {
        state.profileName = event.target.value;
        const caret = event.target.selectionStart;
        render();
        const next = body.querySelector('#profile-name');
        next.focus();
        next.setSelectionRange(caret, caret);
      });

      const endpoint = body.querySelector('#endpoint');
      if (endpoint) endpoint.addEventListener('input', (event) => { state.endpoint = event.target.value; });

      const trust = body.querySelector('#trust-confirmation');
      if (trust) trust.addEventListener('change', (event) => { state.trustConfirmed = event.target.checked; });

      const permit = body.querySelector('#permit');
      if (permit) permit.addEventListener('input', (event) => { state.permit = event.target.value; });

      const prepareKey = body.querySelector('[data-action="prepare-key"]');
      if (prepareKey) prepareKey.addEventListener('click', async () => {
        if (!state.publicKey) state.publicKey = 'MCowBQYDK2VwAyEA8m7wDkH4yXQ2cP5jL0uN3bV6sR1aT9fG7zK4eW2qM8=';
        try { await navigator.clipboard.writeText(state.publicKey); } catch (_) { /* file:// may deny clipboard; the key remains selectable. */ }
        render();
        showToast('本机公钥已生成并复制');
      });

      const form = body.querySelector('#first-form');
      if (form) form.addEventListener('submit', (event) => {
        event.preventDefault();
        if (!form.reportValidity()) return;
        if (state.method === 'approval' && !state.trustConfirmed) {
          showToast('请确认首次连接的信任关系');
          return;
        }
        if (state.method === 'permit' && !state.permit.trim()) {
          showToast('请粘贴 Enrollment Permit');
          body.querySelector('#permit').focus();
          return;
        }
        showToast(state.method === 'approval' ? '注册申请已提交' : '正在使用 Permit 注册并连接');
      });
    }

    function render() {
      renderTabs();
      body.innerHTML = state.view === 'existing' ? existingView() : firstView();
      bindEvents();
    }

    tabs.forEach((tab) => tab.addEventListener('click', () => setView(tab.dataset.view)));
    document.getElementById('appearance-button').addEventListener('click', () => showToast('深色模式沿用现有应用主题，本原型先验证信息架构'));
    document.addEventListener('click', (event) => {
      if (!event.target.closest('[data-menu]') && !event.target.closest('.menu-popover') && state.menuProfileId) {
        state.menuProfileId = '';
        render();
      }
    });

    render();
  </script>
</body>
</html>
