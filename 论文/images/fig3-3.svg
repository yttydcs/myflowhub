<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f4f8f"/>
    </marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#666666"/>
    </marker>
    <style>
      .title { font: 700 30px "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #1f2937; }
      .subtitle { font: 400 16px "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #4b5563; }
      .node-title { font: 700 22px "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #111827; }
      .node-sub { font: 400 15px "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #4b5563; }
      .label { font: 600 18px "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #1f4f8f; }
      .small { font: 400 14px "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #4b5563; }
      .legend-title { font: 700 18px "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #111827; }
      .legend-text { font: 400 15px "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #374151; }
      .node { fill: #ffffff; stroke: #4b5563; stroke-width: 2.2; }
      .node-light { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.8; }
      .panel { fill: #ffffff; stroke: #d1d5db; stroke-width: 1.6; }
      .panel-light { fill: #f9fafb; stroke: #d1d5db; stroke-width: 1.3; }
      .path-main { fill: none; stroke: #1f4f8f; stroke-width: 4; marker-end: url(#arrow-blue); }
      .path-assist { fill: none; stroke: #6b7280; stroke-width: 2.2; marker-end: url(#arrow-gray); }
      .path-dash { fill: none; stroke: #94a3b8; stroke-width: 1.8; stroke-dasharray: 7 6; }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="760" fill="#ffffff"/>

  <text x="70" y="62" class="title">树形路由与逐级转发示意图</text>
  <text x="70" y="92" class="subtitle">显式目标、逐级命中；先判定本地与子树，再决定向父节点上送或向目标子树下发</text>

  <rect x="60" y="120" width="1080" height="430" class="panel"/>

  <rect x="120" y="370" width="170" height="78" class="node"/>
  <text x="205" y="402" text-anchor="middle" class="node-title">源节点</text>
  <text x="205" y="428" text-anchor="middle" class="node-sub">SourceID = 12</text>

  <rect x="340" y="370" width="190" height="78" class="node"/>
  <text x="435" y="402" text-anchor="middle" class="node-title">直接父节点</text>
  <text x="435" y="428" text-anchor="middle" class="node-sub">先进入本级判断</text>

  <rect x="520" y="190" width="210" height="86" class="node"/>
  <text x="625" y="224" text-anchor="middle" class="node-title">上层祖先节点</text>
  <text x="625" y="248" text-anchor="middle" class="node-sub">继续逐级命中目标路径</text>

  <rect x="760" y="370" width="200" height="78" class="node"/>
  <text x="860" y="402" text-anchor="middle" class="node-title">目标子树 Hub</text>
  <text x="860" y="428" text-anchor="middle" class="node-sub">发现目标位于下游</text>

  <rect x="980" y="370" width="160" height="78" class="node"/>
  <text x="1060" y="402" text-anchor="middle" class="node-title">目标节点</text>
  <text x="1060" y="428" text-anchor="middle" class="node-sub">TargetID = 37</text>

  <rect x="780" y="495" width="170" height="64" class="node-light"/>
  <text x="865" y="522" text-anchor="middle" class="node-sub">同层其他子节点</text>
  <text x="865" y="544" text-anchor="middle" class="small">不命中，不转发</text>

  <rect x="510" y="495" width="170" height="64" class="node-light"/>
  <text x="595" y="522" text-anchor="middle" class="node-sub">其他上行分支</text>
  <text x="595" y="544" text-anchor="middle" class="small">不是广播发现</text>

  <path d="M290 409 L340 409" class="path-main"/>
  <text x="315" y="390" text-anchor="middle" class="label">1 向父上送</text>

  <path d="M530 409 L560 409 L560 276" class="path-main"/>
  <text x="575" y="338" class="label">2 目标不在本地下游，继续向上</text>

  <path d="M730 233 L815 233 L815 370" class="path-main"/>
  <text x="845" y="305" class="label">3 命中目标子树，转为向下</text>

  <path d="M960 409 L980 409" class="path-main"/>
  <text x="970" y="390" text-anchor="end" class="label">4 下发到目标</text>

  <path d="M860 448 L860 495" class="path-dash"/>
  <path d="M625 276 L625 495" class="path-dash"/>

  <rect x="70" y="585" width="1060" height="125" class="panel-light"/>
  <text x="95" y="616" class="legend-title">路由判定要点</text>

  <rect x="100" y="635" width="220" height="48" class="node-light"/>
  <text x="210" y="655" text-anchor="middle" class="legend-text">Target = local</text>
  <text x="210" y="674" text-anchor="middle" class="legend-text">本地处理，不再转发</text>

  <rect x="350" y="635" width="250" height="48" class="node-light"/>
  <text x="475" y="655" text-anchor="middle" class="legend-text">Target 在本地下游</text>
  <text x="475" y="674" text-anchor="middle" class="legend-text">直接向子树转发</text>

  <rect x="630" y="635" width="250" height="48" class="node-light"/>
  <text x="755" y="655" text-anchor="middle" class="legend-text">Target 不在本地下游</text>
  <text x="755" y="674" text-anchor="middle" class="legend-text">向父节点逐级上送</text>

  <rect x="910" y="635" width="190" height="48" class="node-light"/>
  <text x="1005" y="655" text-anchor="middle" class="legend-text">TargetID = 0</text>
  <text x="1005" y="674" text-anchor="middle" class="legend-text">仅广播 children</text>

  <path d="M435 448 L435 520" class="path-assist"/>
  <path d="M435 520 L595 520" class="path-assist"/>
  <text x="474" y="506" class="small">逐级命中，不依赖广播发现</text>
</svg>
