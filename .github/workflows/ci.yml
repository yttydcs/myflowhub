name: canonical-ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GOWORK: off

jobs:
  core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true
      - name: Install Linux compile dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc cmake libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Architecture and format gate
        shell: pwsh
        run: ./scripts/mfh.ps1 -Action check -Target core
      - name: Full Go test and vet
        shell: pwsh
        run: ./scripts/mfh.ps1 -Action test -Target core

  generated:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true
      - name: Install pinned Wails generator
        shell: pwsh
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.11.0
      - name: Regenerate and reject drift
        shell: pwsh
        run: ./scripts/mfh.ps1 -Action check -Target generated

  desktop-windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: apps/desktop/frontend/package-lock.json
      - name: Install pinned Wails
        shell: pwsh
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.11.0
      - name: Test and build Desktop
        shell: pwsh
        run: |
          ./scripts/mfh.ps1 -Action test -Target desktop
          ./scripts/mfh.ps1 -Action build -Target desktop
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: apps/desktop/build/bin/*
          if-no-files-found: error

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android NDK and pinned gomobile
        run: |
          sdkmanager 'ndk;27.2.12479018'
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20250520180527-a1d90793fc63
          go install golang.org/x/mobile/cmd/gobind@v0.0.0-20250520180527-a1d90793fc63
          gomobile init
      - name: Test and build Android
        shell: pwsh
        run: |
          ./scripts/mfh.ps1 -Action test -Target android
          ./scripts/mfh.ps1 -Action build -Target android
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug
          path: apps/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  metrics-windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: apps/nodes/metrics/windows/frontend/package-lock.json
      - name: Install pinned Wails
        shell: pwsh
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.11.0
      - name: Test and build Metrics Windows
        shell: pwsh
        run: |
          ./scripts/mfh.ps1 -Action test -Target metrics -AllowUnavailable
          ./scripts/mfh.ps1 -Action build -Target metrics -AllowUnavailable
      - uses: actions/upload-artifact@v4
        with:
          name: metrics-windows
          path: apps/nodes/metrics/windows/build/bin/*
          if-no-files-found: error

  metrics-android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android NDK and pinned gomobile
        run: |
          sdkmanager 'ndk;27.2.12479018'
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20250520180527-a1d90793fc63
          go install golang.org/x/mobile/cmd/gobind@v0.0.0-20250520180527-a1d90793fc63
          gomobile init
      - name: Generate and build Metrics Android
        shell: pwsh
        run: ./scripts/mfh.ps1 -Action build -Target metrics -AllowUnavailable
      - uses: actions/upload-artifact@v4
        with:
          name: metrics-android-debug
          path: apps/nodes/metrics/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  clipboard:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true
      - name: Install pinned gomobile
        shell: pwsh
        run: |
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20250520180527-a1d90793fc63
          go install golang.org/x/mobile/cmd/gobind@v0.0.0-20250520180527-a1d90793fc63
          gomobile init
      - name: Test and build Clipboard
        shell: pwsh
        run: |
          ./scripts/mfh.ps1 -Action test -Target clipboard
          ./scripts/mfh.ps1 -Action build -Target clipboard
      - uses: actions/upload-artifact@v4
        with:
          name: clipboard-products
          path: |
            apps/nodes/clipboard/app/build/windows/x64/runner/Release/*
            apps/nodes/clipboard/app/build/app/outputs/flutter-apk/*.apk
            apps/nodes/clipboard/app/build/web/**
          if-no-files-found: error

  embedded-host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true
      - name: Host contract tests
        shell: pwsh
        run: ./scripts/mfh.ps1 -Action test -Target embedded

  esp32-idf6:
    runs-on: ubuntu-24.04
    container: espressif/idf:v6.0.2
    steps:
      - uses: actions/checkout@v4
      - name: Build ESP32-S3 demo
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          idf.py -C embedded/esp32 set-target esp32s3
          idf.py -C embedded/esp32 build
      - uses: actions/upload-artifact@v4
        with:
          name: esp32s3-firmware
          path: embedded/esp32/build/*.bin
          if-no-files-found: error
