name: canonical-ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GOWORK: off

jobs:
  core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true
      - name: Install Linux compile dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Architecture and format gate
        shell: pwsh
        run: ./scripts/mfh.ps1 -Action check -Target core
      - name: Full Go test and vet
        shell: pwsh
        run: ./scripts/mfh.ps1 -Action test -Target core

  generated:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true
      - name: Install pinned Wails generator
        shell: pwsh
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.11.0
      - name: Regenerate and reject drift
        shell: pwsh
        run: ./scripts/mfh.ps1 -Action check -Target generated

  desktop-windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: apps/desktop/frontend/package-lock.json
      - name: Install pinned Wails
        shell: pwsh
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.11.0
      - name: Test and build Desktop
        shell: pwsh
        run: |
          ./scripts/mfh.ps1 -Action test -Target desktop
          ./scripts/mfh.ps1 -Action build -Target desktop
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: apps/desktop/build/bin/*
          if-no-files-found: error

  metrics-windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: apps/nodes/metrics/windows/frontend/package-lock.json
      - name: Install pinned Wails
        shell: pwsh
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.11.0
      - name: Test and build Metrics Windows
        shell: pwsh
        run: |
          ./scripts/mfh.ps1 -Action test -Target metrics
          ./scripts/mfh.ps1 -Action build -Target metrics
      - uses: actions/upload-artifact@v4
        with:
          name: metrics-windows
          path: apps/nodes/metrics/windows/build/bin/*
          if-no-files-found: error

  clipboard:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true
      - name: Test and build Clipboard
        shell: pwsh
        run: |
          ./scripts/mfh.ps1 -Action test -Target clipboard
          ./scripts/mfh.ps1 -Action build -Target clipboard
      - uses: actions/upload-artifact@v4
        with:
          name: clipboard-products
          path: |
            apps/nodes/clipboard/app/build/windows/x64/runner/Release/*
            apps/nodes/clipboard/app/build/web/**
          if-no-files-found: error
